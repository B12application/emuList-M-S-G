name: Media Backup Job (15 Günde Bir - Ayın 8 ve 22'si Gece 00:00 TRT)

on:
  schedule:
    # Runs on the 7th and 21st of every month at 21:00 UTC (8th and 22nd at 00:00 Turkey Time / TRT UTC+3)
    - cron: '0 21 7,21 * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI anytime

permissions:
  contents: write

jobs:
  backup-media:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Media Backup Script
        env:
          VITE_API_KEY: ${{ secrets.VITE_API_KEY || 'AIzaSyDbxNvt8gT5VUQjb1I0MS6sLTQaTTh9f_0' }}
          VITE_AUTH_DOMAIN: ${{ secrets.VITE_AUTH_DOMAIN || 'emucalendarbinbin.firebaseapp.com' }}
          VITE_PROJECT_ID: ${{ secrets.VITE_PROJECT_ID || 'emucalendarbinbin' }}
          VITE_STORAGE_BUCKET: ${{ secrets.VITE_STORAGE_BUCKET || 'emucalendarbinbin.firebasestorage.app' }}
          VITE_MESSAGING_SENDER_ID: ${{ secrets.VITE_MESSAGING_SENDER_ID || '851837361679' }}
          VITE_APP_ID: ${{ secrets.VITE_APP_ID || '1:851837361679:web:84643d98dbe5edf6a5cd7a' }}
          VITE_ADMIN_UID: ${{ secrets.VITE_ADMIN_UID || 'ZKU7SObBkeNzMicltUKJjo6ybHH2' }}
          FIREBASE_AUTH_EMAIL: ${{ secrets.FIREBASE_AUTH_EMAIL || secrets.BACKUP_AUTH_EMAIL }}
          FIREBASE_AUTH_PASSWORD: ${{ secrets.FIREBASE_AUTH_PASSWORD || secrets.BACKUP_AUTH_PASSWORD }}
        run: npm run backup:media

      - name: Commit and Push Backups
        run: |
          git config --global user.name "B12 Backup Bot"
          git config --global user.email "backup-bot@b12.local"
          git add backups/media/
          if git diff --staged --quiet; then
            echo "ℹ️ Yedekleme dosyasında değişiklik yok, commit atlanıyor."
          else
            git commit -m "chore(backup): automated biweekly media backup [skip ci]"
            git push origin HEAD
            echo "✅ 15 günlük medya yedeği repoya başarıyla pushlandı!"
          fi
