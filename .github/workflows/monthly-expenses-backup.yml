name: Monthly Expenses Backup Job (Ayın 15'i Gece 00:00 TRT)

on:
  schedule:
    # Runs on the 14th of every month at 21:00 UTC (15th of every month at 00:00 Turkey Time / TRT UTC+3)
    - cron: '0 21 14 * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI anytime

permissions:
  contents: write

jobs:
  backup-expenses:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Expenses Backup Script
        env:
          VITE_API_KEY: ${{ secrets.VITE_API_KEY || 'AIzaSyDbxNvt8gT5VUQjb1I0MS6sLTQaTTh9f_0' }}
          VITE_AUTH_DOMAIN: ${{ secrets.VITE_AUTH_DOMAIN || 'emucalendarbinbin.firebaseapp.com' }}
          VITE_PROJECT_ID: ${{ secrets.VITE_PROJECT_ID || 'emucalendarbinbin' }}
          VITE_STORAGE_BUCKET: ${{ secrets.VITE_STORAGE_BUCKET || 'emucalendarbinbin.firebasestorage.app' }}
          VITE_MESSAGING_SENDER_ID: ${{ secrets.VITE_MESSAGING_SENDER_ID || '851837361679' }}
          VITE_APP_ID: ${{ secrets.VITE_APP_ID || '1:851837361679:web:84643d98dbe5edf6a5cd7a' }}
          VITE_ADMIN_UID: ${{ secrets.VITE_ADMIN_UID || 'ZKU7SObBkeNzMicltUKJjo6ybHH2' }}
          FIREBASE_AUTH_EMAIL: ${{ secrets.FIREBASE_AUTH_EMAIL }}
          FIREBASE_AUTH_PASSWORD: ${{ secrets.FIREBASE_AUTH_PASSWORD }}
        run: npm run backup:expenses

      - name: Commit and Push Backups
        run: |
          git config --global user.name "emuList Backup Bot"
          git config --global user.email "backup-bot@emulist.local"
          git add backups/expenses/
          if git diff --staged --quiet; then
            echo "ℹ️ Harcama yedeğinde değişiklik yok, commit atlanıyor."
          else
            git commit -m "chore(backup): monthly expenses backup [skip ci]"
            git push
            echo "✅ Aylık harcama yedeği repoya başarıyla pushlandı!"
          fi
