<svg viewBox="0 0 512 512" width="512" height="512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="50%" stop-color="#0c0a09"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>

    <!-- Top Glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Pill Cap Gradient (Golden Amber) -->
    <linearGradient id="pillGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="25%" stop-color="#fde047"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Pill Base Gradient (Dark Titanium / Smoked Glass) -->
    <linearGradient id="pillTitanium" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#292524"/>
      <stop offset="50%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#0c0a09"/>
    </linearGradient>

    <!-- Glowing Border for Capsule -->
    <linearGradient id="capsuleStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Number 12 Gradient -->
    <linearGradient id="num12Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="35%" stop-color="#fde047"/>
      <stop offset="85%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- White B Gradient -->
    <linearGradient id="whiteBGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="80%" stop-color="#f4f4f5"/>
      <stop offset="100%" stop-color="#e4e4e7"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadowCapsule" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#f59e0b" flood-opacity="0.35"/>
    </filter>

    <filter id="shadowText" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#ambientGlow)"/>
  <rect x="18" y="18" width="476" height="476" rx="110" fill="none" stroke="#f59e0b" stroke-opacity="0.25" stroke-width="2.5"/>

  <!-- Glowing Energy Aura behind Capsule -->
  <g transform="translate(256, 256) rotate(-35) translate(-256, -256)" filter="url(#shadowCapsule)">
    <!-- Outer Glow Capsule Ring -->
    <rect x="156" y="86" width="200" height="340" rx="100" fill="none" stroke="#f59e0b" stroke-width="8" stroke-opacity="0.4" filter="blur(6px)"/>
    
    <!-- Main Capsule Body -->
    <!-- Bottom Half: Dark Titanium -->
    <path d="M 166 256 V 326 C 166 375.7 206.3 416 256 416 C 305.7 416 346 375.7 346 326 V 256 Z" fill="url(#pillTitanium)"/>
    
    <!-- Top Half: Solid Golden Amber -->
    <path d="M 166 256 V 186 C 166 136.3 206.3 96 256 96 C 305.7 96 346 136.3 346 186 V 256 Z" fill="url(#pillGold)"/>

    <!-- Specular Sheen on Top Cap -->
    <path d="M 186 186 C 186 147.3 217.3 116 256 116 C 272 116 286 122 298 132 C 274 130 234 144 212 178 C 196 202 192 230 192 250 C 188 232 186 210 186 186 Z" fill="#ffffff" fill-opacity="0.35"/>

    <!-- Capsule Border -->
    <rect x="166" y="96" width="180" height="320" rx="90" fill="none" stroke="url(#capsuleStroke)" stroke-width="6"/>

    <!-- Glowing Center Divider Ring -->
    <rect x="160" y="250" width="192" height="12" rx="6" fill="#ffffff" fill-opacity="0.9" filter="drop-shadow(0 0 6px #fde047)"/>
  </g>

  <!-- High-Precision B12 Typography Overlay (Optically Centered) -->
  <g filter="url(#shadowText)">
    <!-- Letter 'B' (White) -->
    <path fill="url(#whiteBGrad)" fill-rule="evenodd" clip-rule="evenodd" d="
      M 132 208
      C 132 199.16 139.16 192 148 192
      H 206
      C 236 192 258 210 258 236
      C 258 253 246 268 228 274
      C 252 281 268 298 268 325
      C 268 356 240 378 206 378
      H 148
      C 139.16 378 132 370.84 132 362
      V 208
      Z
      M 174 226
      V 268
      H 204
      C 219 268 228 258 228 247
      C 228 236 219 226 204 226
      H 174
      Z
      M 174 302
      V 344
      H 206
      C 222 344 236 333 236 323
      C 236 313 222 302 206 302
      H 174
      Z"
    />

    <!-- Digit '1' (Gold Amber) -->
    <path fill="url(#num12Grad)" d="
      M 284 228
      L 305 210
      C 307.5 208 311 209.8 311 213
      V 373
      C 311 375.8 308.8 378 306 378
      H 289
      C 286.2 378 284 375.8 284 373
      V 239
      L 274 246
      C 271.5 248 268 247 266 244.5
      L 261 237.5
      C 259 235 259.8 231.8 262.5 230
      L 284 228
      Z"
    />

    <!-- Digit '2' (Gold Amber) -->
    <path fill="url(#num12Grad)" d="
      M 326 238
      C 326 214 344 196 370 196
      C 396 196 414 214 414 238
      C 414 260 398 282 372 308
      L 350 330
      H 406
      C 410.4 330 414 333.6 414 338
      V 342
      C 414 346.4 410.4 350 406 350
      H 336
      C 328.5 350 324 341 329 334.5
      L 368 296
      C 385 279 394 264 394 249
      C 394 237 384 226 370 226
      C 356 226 346 237 346 249
      C 346 253.4 342.4 257 338 257
      H 334
      C 329.6 257 326 253.4 326 249
      V 238
      Z"
    />
  </g>
</svg>